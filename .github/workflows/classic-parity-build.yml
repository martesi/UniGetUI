name: Classic feature parity validation
on:
  push:
    branches: [classic-test-feature-parity]
    paths:
      - maintenance/workbench/**
      - .github/workflows/classic-parity-build.yml
permissions:
  contents: write
concurrency:
  group: classic-feature-parity-workbench
  cancel-in-progress: false
jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble isolated source snapshot
        shell: pwsh
        run: |
          git config core.autocrlf false
          python maintenance/workbench/assemble.py ../parity-src
      - name: Export exact sources for review
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          output = Path('parity-artifacts')
          output.mkdir(exist_ok=True)
          with zipfile.ZipFile(output / 'review-sources.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name, root in [('source', Path('../parity-src')), ('workbench', Path('maintenance/workbench'))]:
                  for path in root.rglob('*'):
                      if not path.is_file() or '.git' in path.parts or path.suffix not in {'.cs', '.xaml', '.csproj', '.py', '.ps1', '.yml', '.json', '.md', '.props', '.targets'}:
                          continue
                      archive.write(path, name + '/' + str(path.relative_to(root)).replace('\\', '/'))
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: classic-parity-nuget-v2-${{ hashFiles('global.json') }}
          restore-keys: classic-parity-nuget-
      - name: Restore source
        id: restore
        working-directory: ../parity-src
        shell: pwsh
        run: |
          dotnet restore src/UniGetUI.Windows.slnx 2>&1 | Tee-Object -FilePath ../UniGetUI/parity-artifacts/restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v5
        if: steps.restore.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: classic-parity-nuget-v2-${{ hashFiles('global.json') }}
      - name: Build full Windows solution
        working-directory: ../parity-src
        shell: pwsh
        run: |
          dotnet build src/UniGetUI.Windows.slnx --no-restore --verbosity minimal /m:1 /p:Platform=x64 /p:UseSharedCompilation=false 2>&1 | Tee-Object -FilePath ../UniGetUI/parity-artifacts/build.log
          $BuildExitCode = $LASTEXITCODE
          if ($BuildExitCode -ne 0) {
            Get-ChildItem src/UniGetUI/obj -Recurse -File -Include input.json,output.json -ErrorAction SilentlyContinue | ForEach-Object {
              $Name = ($_.FullName.Substring((Resolve-Path src/UniGetUI).Path.Length + 1) -replace '[\\/:]', '_')
              Copy-Item $_.FullName "../UniGetUI/parity-artifacts/xaml-$Name"
            }
            $InputJson = Get-ChildItem src/UniGetUI/obj -Recurse -File -Filter input.json | Select-Object -First 1
            $XamlCompiler = Get-ChildItem "$env:NUGET_PACKAGES\microsoft.windowsappsdk" -Recurse -File -Filter XamlCompiler.exe |
              Where-Object { $_.Directory.Name -eq 'net472' } |
              Select-Object -First 1
            if ($InputJson -and $XamlCompiler) {
              $OutputJson = Join-Path $InputJson.Directory.FullName 'manual-output.json'
              & $XamlCompiler.FullName $InputJson.FullName $OutputJson 2>&1 |
                Tee-Object -FilePath ../UniGetUI/parity-artifacts/xaml-compiler-direct.log
              Write-Host "Direct XAML compiler exit code: $LASTEXITCODE"
              if (Test-Path $OutputJson) {
                Copy-Item $OutputJson ../UniGetUI/parity-artifacts/xaml-manual-output.json
              }
            }
            exit $BuildExitCode
          }
      - name: Test reconstructed source
        working-directory: ../parity-src
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet test src/UniGetUI.Windows.slnx --no-build --no-restore --verbosity minimal --nologo /p:Platform=x64 /p:UseSharedCompilation=false --logger trx --results-directory ../UniGetUI/parity-artifacts/tests 2>&1 | Tee-Object -FilePath ../UniGetUI/parity-artifacts/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native windows and persisted settings
        timeout-minutes: 5
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File maintenance/workbench/ui-smoke.ps1 -SourceRoot ../parity-src -OutputDirectory parity-artifacts/native-ui 2>&1 | Tee-Object -FilePath parity-artifacts/native-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and verify maintenance-only patch branch
        timeout-minutes: 10
        shell: pwsh
        run: python maintenance/workbench/finalize.py ../parity-src
      - name: Summarize diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem parity-artifacts/*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Select-String -Path $_ -Pattern 'error |Failed |Passed!|Test Run|Build succeeded|Build FAILED|Exception|Native UI|Patch stack verified' | ForEach-Object { $_.Line }
          } | Sort-Object -Unique | Set-Content parity-artifacts/diagnostics.txt
          Get-Content parity-artifacts/diagnostics.txt -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-parity-validation-${{ github.run_id }}
          path: parity-artifacts
          retention-days: 7
