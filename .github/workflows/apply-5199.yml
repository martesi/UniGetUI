name: Apply PR 5199 backport

on:
  push:
    branches:
      - backport-5167-5199
    paths:
      - .github/workflows/apply-5199.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: backport-5167-5199
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin upstream

      - name: Cherry-pick upstream PR 5199
        shell: pwsh
        run: |
          $commit = '26c93b859babdc831b2d8462048d3e5f85d3da67'

          git cherry-pick -x $commit
          if ($LASTEXITCODE -ne 0) {
            $conflicts = @(git diff --name-only --diff-filter=U)
            foreach ($path in $conflicts) {
              if ($path -like 'src/UniGetUI.PackageEngine.Tests/*') {
                Write-Host "Keeping Classic-side test file for expected layout drift: $path"
                git checkout --ours -- $path
                git add -- $path
                continue
              }

              Write-Host "Unexpected production conflict: $path"
              git cherry-pick --abort
              throw "PR 5199 requires semantic adaptation in $path"
            }

            git -c core.editor=true cherry-pick --continue
            if ($LASTEXITCODE -ne 0) {
              git cherry-pick --abort
              throw 'Could not continue PR 5199 cherry-pick.'
            }
          }

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore PackageEngine tests
        working-directory: src
        shell: pwsh
        run: dotnet restore UniGetUI.PackageEngine.Tests/UniGetUI.PackageEngine.Tests.csproj /p:Platform=x64

      - name: Test PackageEngine
        working-directory: src
        shell: pwsh
        run: dotnet test UniGetUI.PackageEngine.Tests/UniGetUI.PackageEngine.Tests.csproj --no-restore --verbosity minimal /p:Platform=x64

      - name: Push validated backport
        shell: pwsh
        run: git push origin HEAD:backport-5167-5199
