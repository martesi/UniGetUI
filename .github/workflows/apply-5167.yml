name: Apply PR 4998 and 5199 backports

on:
  push:
    branches:
      - backport-5167-5199
    paths:
      - .github/workflows/apply-5167.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: backport-5167-5199
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply WinGet not-applicable and phantom-update fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          options_path = Path('src/UniGetUI.PackageEngine.Enums/OverridenInstallationOptions.cs')
          helper_path = Path('src/UniGetUI.PackageEngine.Managers.WinGet/Helpers/WinGetPkgOperationHelper.cs')
          tests_path = Path('src/UniGetUI.PackageEngine.Tests/WinGetManagerTests.cs')

          def line_index(lines, text, start=0):
              for index in range(start, len(lines)):
                  if lines[index].strip() == text:
                      return index
              raise SystemExit(f'line anchor not found: {text}')

          def wrap_call(lines, marker, condition):
              marker_index = next(
                  (i for i, line in enumerate(lines) if marker in line),
                  None,
              )
              if marker_index is None:
                  raise SystemExit(f'call marker not found: {marker}')
              start = marker_index
              while start >= 0 and lines[start].strip() != 'parameters.AddRange(':
                  start -= 1
              if start < 0:
                  raise SystemExit(f'parameters.AddRange start not found for: {marker}')
              end = line_index(lines, ');', start + 1)
              base_indent = lines[start][:-len(lines[start].lstrip())]
              block = [base_indent + '    ' + line[len(base_indent):] for line in lines[start:end + 1]]
              replacement = [
                  base_indent + f'if ({condition})\n',
                  base_indent + '{\n',
                  *block,
                  base_indent + '}\n',
              ]
              lines[start:end + 1] = replacement

          options = options_path.read_text(encoding='utf-8')
          field = '    public bool WinGet_DropArchAndScope = false;\n'
          if field not in options:
              anchor = '    public bool Pip_BreakSystemPackages = false;\n'
              if anchor not in options:
                  raise SystemExit('OverridenInstallationOptions field anchor not found')
              options = options.replace(anchor, anchor + field, 1)
          old = 'Pip_BreakSystemPackages={Pip_BreakSystemPackages}>";'
          new = 'Pip_BreakSystemPackages={Pip_BreakSystemPackages};WG_DropArchAndScope={WinGet_DropArchAndScope}>";'
          if old in options:
              options = options.replace(old, new, 1)
          elif new not in options:
              raise SystemExit('OverridenInstallationOptions ToString anchor not found')
          options_path.write_text(options, encoding='utf-8', newline='\n')

          lines = helper_path.read_text(encoding='utf-8').splitlines(keepends=True)
          if not any('WinGet_DropArchAndScope is set after an' in line for line in lines):
              scope_comment = next(
                  (i for i, line in enumerate(lines) if 'package.OverridenInstallationOptions.Scope is meaningless' in line),
                  None,
              )
              if scope_comment is None:
                  raise SystemExit('scope comment anchor not found')
              scope_call = line_index(lines, 'parameters.AddRange(', scope_comment + 1)
              scope_end = line_index(lines, ');', scope_call + 1)
              base_indent = lines[scope_call][:-len(lines[scope_call].lstrip())]
              original = [base_indent + '    ' + line[len(base_indent):] for line in lines[scope_call:scope_end + 1]]
              lines[scope_call:scope_end + 1] = [
                  base_indent + '// WinGet_DropArchAndScope is set after an "update not applicable" result so the retry\n',
                  base_indent + '// lets WinGet choose a compatible installer instead of repeating the same constraints.\n',
                  base_indent + 'if (!package.OverridenOptions.WinGet_DropArchAndScope)\n',
                  base_indent + '{\n',
                  *original,
                  base_indent + '}\n',
              ]

              wrap_call(
                  lines,
                  'options.Architecture switch',
                  '!package.OverridenOptions.WinGet_DropArchAndScope',
              )

          old_start = next(
              (i for i, line in enumerate(lines) if line.strip() == 'if (uintCode is 0x8A15002B)'),
              None,
          )
          if old_start is not None:
              base_indent = lines[old_start][:-len(lines[old_start].lstrip())]
              old_end = next(
                  (
                      i
                      for i in range(old_start + 1, len(lines))
                      if lines[i].strip() == '}'
                      and lines[i][:-len(lines[i].lstrip())] == base_indent
                  ),
                  None,
              )
              if old_end is None:
                  raise SystemExit('not-applicable block end not found')
              replacement = indent(
                  dedent('''
                  // WinGet (CLI/COM) reports "not applicable" as 0x8A15002B; bundled pinget instead exits
                  // non-zero with "No applicable installer found" in its output (#4998).
                  bool pingetReportedNotApplicable =
                      ((WinGet)Manager).SelectedCliToolKind is WinGetCliToolKind.BundledPinget
                      && returnCode != 0
                      && processOutput.Any(line =>
                          line.Contains("No applicable installer found", StringComparison.OrdinalIgnoreCase)
                      );

                  if (uintCode is 0x8A15002B || pingetReportedNotApplicable)
                  {
                      // A forced scope/architecture may exclude the only installer. Retry once without
                      // those constraints, matching WinGet's normal selection behavior (#4998).
                      if (
                          operation is OperationType.Update
                          && !package.OverridenOptions.WinGet_DropArchAndScope
                      )
                      {
                          var options = InstallOptionsFactory.LoadApplicable(package);
                          bool hasScope =
                              (package.OverridenOptions.Scope ?? options.InstallationScope)
                              is PackageScope.User or PackageScope.Machine;
                          bool hasArch =
                              options.Architecture
                              is Architecture.x86 or Architecture.x64 or Architecture.arm64;

                          if (hasScope || hasArch)
                          {
                              Logger.Warn(
                                  $"Update for {package.Id} reported as not applicable; retrying without the scope/architecture constraints"
                              );
                              package.OverridenOptions.WinGet_DropArchAndScope = true;
                              return OperationVeredict.AutoRetry;
                          }
                      }

                      if (operation is OperationType.Update)
                          SuppressPhantomUpgrade(package);

                      Logger.Warn(
                          $"Update for {package.Id} is not applicable to this system, even without scope/architecture constraints"
                      );
                      return OperationVeredict.Failure;
                  }
                  ''').lstrip(),
                  base_indent,
              ).splitlines(keepends=True)
              lines[old_start:old_end + 1] = replacement

          if not any('public static void SuppressPhantomUpgrade' in line for line in lines):
              insert_at = next(
                  (i for i, line in enumerate(lines) if 'An update WinGet keeps offering even after enough' in line),
                  None,
              )
              if insert_at is None:
                  raise SystemExit('stuck-upgrade method anchor not found')
              base_indent = lines[insert_at][:-len(lines[insert_at].lstrip())]
              method = indent(
                  dedent('''
                  public static void SuppressPhantomUpgrade(IPackage package)
                  {
                      if (IsUnknownVersion(package.NewVersionString))
                          return;
                      Settings.SetDictionaryItem<string, string>(
                          Settings.K.WinGetUpgradeAttempts,
                          package.Id,
                          $"{StuckUpgradeThreshold}{AttemptSeparator}{package.NewVersionString}"
                      );
                  }

                  ''').lstrip(),
                  base_indent,
              ).splitlines(keepends=True)
              method.insert(0, base_indent + '// Mark the offered version as already having reached the stuck-update threshold (#5199).\n')
              lines[insert_at:insert_at] = method

          helper_path.write_text(''.join(lines), encoding='utf-8', newline='\n')

          tests = tests_path.read_text(encoding='utf-8')
          if 'WinGetUpdateNotApplicableSuppressesPhantomUpdate' not in tests:
              marker = '    private static void SetCliToolKind(WinGet manager, WinGetCliToolKind kind)\n'
              if marker not in tests:
                  raise SystemExit('test insertion anchor not found')
              block = indent(
                  dedent('''
                  [Fact]
                  public void WinGetUpdateNotApplicableRetriesOnceWithoutScopeAndArchitecture()
                  {
                      var manager = new WinGet();
                      SetCliToolKind(manager, WinGetCliToolKind.SystemWinGet);
                      var package = new PackageBuilder()
                          .WithManager(manager)
                          .WithId("Klocman.BulkCrapUninstaller")
                          .WithVersion("5.8")
                          .WithNewVersion("5.9")
                          .Build();
                      var options = new InstallOptions
                      {
                          InstallationScope = PackageScope.Machine,
                          Architecture = UniGetUI.PackageEngine.Enums.Architecture.x64,
                      };

                      var firstAttempt = manager.OperationHelper.GetParameters(
                          package,
                          options,
                          OperationType.Update
                      );
                      Assert.Contains("--scope", firstAttempt);
                      Assert.Contains("--architecture", firstAttempt);

                      var veredict = manager.OperationHelper.GetResult(
                          package,
                          OperationType.Update,
                          [],
                          unchecked((int)0x8A15002B)
                      );

                      OperationAssert.HasVeredict(veredict, OperationVeredict.AutoRetry);
                      Assert.True(package.OverridenOptions.WinGet_DropArchAndScope);

                      var retryAttempt = manager.OperationHelper.GetParameters(
                          package,
                          options,
                          OperationType.Update
                      );
                      Assert.DoesNotContain("--scope", retryAttempt);
                      Assert.DoesNotContain("--architecture", retryAttempt);
                  }

                  [Fact]
                  public void WinGetUpdateNotApplicableDoesNotRetryASecondTime()
                  {
                      var manager = new WinGet();
                      SetCliToolKind(manager, WinGetCliToolKind.SystemWinGet);
                      var package = new PackageBuilder()
                          .WithManager(manager)
                          .WithId("Klocman.BulkCrapUninstaller")
                          .WithVersion("5.8")
                          .WithNewVersion("5.9")
                          .Build();
                      package.OverridenOptions.WinGet_DropArchAndScope = true;

                      var veredict = manager.OperationHelper.GetResult(
                          package,
                          OperationType.Update,
                          [],
                          unchecked((int)0x8A15002B)
                      );

                      OperationAssert.HasVeredict(veredict, OperationVeredict.Failure);
                  }

                  [Fact]
                  public void WinGetUpdateNotApplicableViaPingetRetriesWithoutScopeAndArchitecture()
                  {
                      var manager = new WinGet();
                      SetCliToolKind(manager, WinGetCliToolKind.BundledPinget);
                      var package = new PackageBuilder()
                          .WithManager(manager)
                          .WithId("Contoso.Tool")
                          .WithVersion("1.0.0")
                          .WithNewVersion("2.0.0")
                          .Build();
                      var options = new InstallOptions
                      {
                          InstallationScope = PackageScope.Machine,
                          Architecture = UniGetUI.PackageEngine.Enums.Architecture.x64,
                      };
                      _ = manager.OperationHelper.GetParameters(package, options, OperationType.Update);

                      var veredict = manager.OperationHelper.GetResult(
                          package,
                          OperationType.Update,
                          ["No applicable installer found"],
                          1
                      );

                      OperationAssert.HasVeredict(veredict, OperationVeredict.AutoRetry);
                      Assert.True(package.OverridenOptions.WinGet_DropArchAndScope);
                  }

                  [Fact]
                  public void WinGetUpdateNotApplicableSuppressesPhantomUpdate()
                  {
                      var manager = new WinGet();
                      SetCliToolKind(manager, WinGetCliToolKind.SystemWinGet);
                      var package = new PackageBuilder()
                          .WithManager(manager)
                          .WithId("Hugin.Hugin")
                          .WithVersion("20.25.0")
                          .WithNewVersion("2025.0.1")
                          .Build();

                      Assert.False(WinGetPkgOperationHelper.IsStuckUpgradeLoop(package));

                      var veredict = manager.OperationHelper.GetResult(
                          package,
                          OperationType.Update,
                          [],
                          unchecked((int)0x8A15002B)
                      );

                      OperationAssert.HasVeredict(veredict, OperationVeredict.Failure);
                      Assert.True(WinGetPkgOperationHelper.IsStuckUpgradeLoop(package));

                      var newerUpdate = new PackageBuilder()
                          .WithManager(manager)
                          .WithId("Hugin.Hugin")
                          .WithVersion("20.25.0")
                          .WithNewVersion("2026.0.0")
                          .Build();
                      Assert.False(WinGetPkgOperationHelper.IsStuckUpgradeLoop(newerUpdate));
                  }

                  ''').lstrip(),
                  '    ',
              )
              tests = tests.replace(marker, block + marker, 1)
              tests_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

          git add \
            src/UniGetUI.PackageEngine.Enums/OverridenInstallationOptions.cs \
            src/UniGetUI.PackageEngine.Managers.WinGet/Helpers/WinGetPkgOperationHelper.cs \
            src/UniGetUI.PackageEngine.Tests/WinGetManagerTests.cs
          git commit -m 'Classic: backport WinGet not-applicable and phantom-update fixes' \
            -m 'Semantically ports upstream 249cc4d0 (#4998) and 26c93b85 (#5199) on top of the Classic WinUI backend.'

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore PackageEngine tests
        working-directory: src
        shell: pwsh
        run: dotnet restore UniGetUI.PackageEngine.Tests/UniGetUI.PackageEngine.Tests.csproj /p:Platform=x64

      - name: Test PackageEngine
        working-directory: src
        shell: pwsh
        run: dotnet test UniGetUI.PackageEngine.Tests/UniGetUI.PackageEngine.Tests.csproj --no-restore --verbosity minimal /p:Platform=x64

      - name: Push validated backports
        shell: pwsh
        run: git push origin HEAD:backport-5167-5199
