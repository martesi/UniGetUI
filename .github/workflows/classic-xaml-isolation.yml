name: Classic XAML isolation
on:
  push:
    branches: [classic-test-feature-parity]
    paths: [.github/workflows/classic-xaml-isolation.yml]
permissions:
  contents: read
jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        variant: [current, baseline, no-install-options, no-packages-ui, no-install-or-packages]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.variant == 'baseline' && 'classic-feature-source-baseline' || 'classic-feature-parity-source-35490463937' }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Revert feature UI
        if: startsWith(matrix.variant, 'no-')
        shell: pwsh
        run: |
          $baseline = 'b5efda4c9918b5585c08ec419ed57b7c3fd8a11f'
          function Restore-File([string]$path) {
            $spec = $baseline + ':' + $path
            git show $spec | Set-Content -Encoding utf8 $path
          }
          if ('${{ matrix.variant }}' -in @('no-install-options', 'no-install-or-packages')) {
            Restore-File 'src/UniGetUI/Pages/DialogPages/InstallOptions_Package.xaml'
            Restore-File 'src/UniGetUI/Pages/DialogPages/InstallOptions_Package.xaml.cs'
          }
          if ('${{ matrix.variant }}' -in @('no-packages-ui', 'no-install-or-packages')) {
            Restore-File 'src/UniGetUI/Pages/SoftwarePages/AbstractPackagesPage.xaml'
            Restore-File 'src/UniGetUI/Pages/SoftwarePages/AbstractPackagesPage.xaml.cs'
            Restore-File 'src/UniGetUI/Controls/PackageItemContainer.cs'
            Remove-Item 'src/UniGetUI/Controls/PackageWrapper.Columns.cs' -ErrorAction SilentlyContinue
          }
      - name: Restore WinUI project
        run: dotnet restore src/UniGetUI/UniGetUI.csproj /p:Platform=x64
      - name: Build WinUI project
        run: dotnet build src/UniGetUI/UniGetUI.csproj --no-restore --verbosity minimal /m:1 /p:Platform=x64 /p:UseSharedCompilation=false
