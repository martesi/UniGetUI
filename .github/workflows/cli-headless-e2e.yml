name: CLI Headless E2E

on:
  workflow_dispatch:

jobs:
  cli-headless-e2e:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-e2e-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.sln', 'src/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-e2e-

      - name: Restore solution
        working-directory: src
        shell: pwsh
        run: dotnet restore UniGetUI.Windows.slnx

      - name: Build headless daemon
        working-directory: src
        shell: pwsh
        run: dotnet build UniGetUI/UniGetUI.csproj --no-restore --configuration ${{ env.CONFIGURATION }} --verbosity minimal -p:Platform=x64

      - name: Upgrade pip tooling
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Show package-manager inventory
        shell: pwsh
        run: |
          dotnet --version
          python --version
          python -m pip --version
          npm --version

      - name: Run headless CLI E2E
        shell: pwsh
        env:
          UNIGETUI_CLI_E2E_MANIFEST: testing/automation/cli-e2e.manifest.windows.json
          UNIGETUI_CLI_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/cli-headless-e2e/${{ runner.os }}
        run: ./testing/automation/run-cli-e2e.ps1

      - name: Upload CLI E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-headless-e2e-windows
          path: artifacts/cli-headless-e2e/${{ runner.os }}
          if-no-files-found: warn
