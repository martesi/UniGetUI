name: Fix bootstrap syntax

on:
  push:
    branches: [bootstrap-backports]
    paths: [.github/workflows/fix-bootstrap-syntax.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bootstrap-backports
      - name: Fix missing WinGet condition parenthesis
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/UniGetUI.PackageEngine.Managers.WinGet/Helpers/WinGetPkgOperationHelper.cs')
          text = path.read_text(encoding='utf-8')
          old = '''                        || !string.Equals(
                            installerType,
                            "portable",
                            StringComparison.OrdinalIgnoreCase
                        )
                        return null;
'''
          new = '''                        || !string.Equals(
                            installerType,
                            "portable",
                            StringComparison.OrdinalIgnoreCase
                        )
                    )
                        return null;
'''
          if old not in text:
              raise SystemExit('expected syntax pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UniGetUI.PackageEngine.Managers.WinGet/Helpers/WinGetPkgOperationHelper.cs
          git commit -m 'Classic: fix portable installer condition'
          git push origin HEAD:bootstrap-backports
